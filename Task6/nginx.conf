http {
    # Настройка зоны для ограничения запросов (10 запросов в минуту)
    limit_req_zone $binary_remote_addr zone=partner_limit:10m rate=10r/m;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # Применяем ограничение скорости
            limit_req zone=partner_limit burst=5 nodelay;
            limit_req_status 429;  # Код ответа при превышении лимита
            
            proxy_pass http://backend_servers;
            
            # Добавляем заголовки для информации о лимитах
            add_header X-RateLimit-Limit "10";
            add_header X-RateLimit-Remaining "$remaining";
            add_header X-RateLimit-Reset "$limit_reset";
        }
    }
}